plugins {
    id 'com.android.application'
}

android {
    namespace 'com.github.lorenj.wordtint'
    // 编译的版本,对于开发而言是有效的
    compileSdk = 37
    defaultConfig {
        applicationId "com.github.lorenj.wordtint"
        // 最低的android版本要求
        minSdk 26
        // 承诺当前app可以在哪个版本下完美运行,target不能大于compileSdk
        targetSdk 37
        versionCode 190
        versionName "1.9.0"

        javaCompileOptions {
            annotationProcessorOptions {
                // 数据库相关
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 不打包不需要的文件
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
    }

}

dependencies {
    // Markwon
    final def markwon_version = '4.6.2'
    implementation "io.noties.markwon:core:$markwon_version"
    implementation "io.noties.markwon:html:$markwon_version"
    implementation "io.noties.markwon:image:$markwon_version"

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // 数据库
    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"
    // 生命周期库
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.jayway.jsonpath:json-path:3.0.0'
    implementation 'io.github.h07000223:flycoTabLayout:3.0.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation("org.apache.commons:commons-text:1.15.0")
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}